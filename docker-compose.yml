version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: identityservice-postgres
    environment:
      POSTGRES_DB: identityservice_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identityservice-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identityservice-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=PostgreSql
      - ConnectionStrings__PostgreSql=Host=postgres;Port=5432;Database=identityservice_db;Username=postgres;Password=postgres123;
      - Jwt__Key=7G+H65bLToXxqzPvj7+q0oQUlxJp1WvdOU3nv3ArA1s=
      - Jwt__ExpirationTimeHour=5
      - Jwt__IncreaseExpirationTimeMinutes=20
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - identityservice-network

  prometheus:
    image: prom/prometheus:latest
    container_name: identityservice-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - identityservice-network

  grafana:
    image: grafana/grafana:latest
    container_name: identityservice-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./monitoring/grafana/identityservice-dashboard.json:/etc/grafana/provisioning/dashboards/identityservice-dashboard.json
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - identityservice-network

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  identityservice-network:
    driver: bridge
