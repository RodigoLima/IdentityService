version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identityservice-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=host.docker.internal;Port=5432;Database=IdentityService;Username=docker;Password=docker
      - Jwt__Key=7G+H65bLToXxqzPvj7+q0oQUlxJp1WvdOU3nv3ArA1s=
      - Jwt__ExpirationTimeHour=5
      - Jwt__IncreaseExpirationTimeMinutes=20
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - identityservice-network

networks:
  identityservice-network:
    driver: bridge
